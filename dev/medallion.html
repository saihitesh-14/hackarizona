<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medallion test page</title>
  <link rel="stylesheet" href="./medallion.css">
  <script>
    // ?nowebgl: pretend WebGL is missing, to prove the static logo fallback.
    if (new URLSearchParams(location.search).has('nowebgl')) {
      const getContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, ...rest) {
        return /webgl/i.test(type) ? null : getContext.call(this, type, ...rest);
      };
    }
  </script>
</head>
<body>
  <main>
    <section class="hero">
      <div class="medallion" role="img" tabindex="0" aria-label="The Hack Arizona logo, a saguaro drawn as a circuit, as a spinning 3D medallion. Drag to spin it.">
        <img class="medallion-fallback" src="/brand/hackaz-mark.svg" alt="" width="1200" height="1200">
        <canvas class="medallion-canvas" aria-hidden="true"></canvas>
      </div>
      <div class="controls">
        <button type="button" data-action="replay">Replay intro</button>
        <button type="button" data-action="pulse">Pulse</button>
        <button type="button" data-action="theme" aria-pressed="false">Theme</button>
        <button type="button" data-action="pause" aria-pressed="false">Pause</button>
        <output class="fps" aria-live="off">-- fps</output>
        <output class="status" aria-live="polite"></output>
      </div>
    </section>
    <p class="spacer">Scroll down to take the medallion off screen; its render loop stops.</p>
  </main>
  <script type="module">
    import { createMedallion } from '../src/js/medallion.js';

    const wrap = document.querySelector('.medallion');
    const status = document.querySelector('.status');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    const html = document.documentElement;
    let paused = reduced.matches;
    const accent = getComputedStyle(html).getPropertyValue('--accent-fill').trim();

    const medallion = createMedallion({
      canvas: wrap.querySelector('canvas'),
      container: wrap,
      theme: html.dataset.theme,
      paused,
      reducedMotion: reduced.matches,
      accent,
      onReady: () => wrap.classList.add('is-3d'),
      onFallback: () => {
        wrap.classList.remove('is-3d');
        wrap.classList.add('is-fallback');
        status.textContent = 'WebGL unavailable: showing the static logo.';
      },
    });
    window.__medallion = medallion;

    const pauseButton = document.querySelector('[data-action="pause"]');
    const setPaused = value => {
      paused = value;
      pauseButton.setAttribute('aria-pressed', String(paused));
      medallion.setPaused(paused);
    };
    pauseButton.setAttribute('aria-pressed', String(paused));
    reduced.addEventListener('change', () => setPaused(reduced.matches));

    document.querySelector('.controls').addEventListener('click', event => {
      const action = event.target.closest('button')?.dataset.action;
      if (action === 'replay') medallion.replay();
      if (action === 'pulse') medallion.pulse();
      if (action === 'pause') setPaused(!paused);
      if (action === 'theme') {
        const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
        html.dataset.theme = next;
        event.target.setAttribute('aria-pressed', String(next === 'dark'));
        medallion.setTheme(next);
      }
    });

    // FPS from rendered frames, on a timer so the meter adds no animation frames of its own.
    const fps = document.querySelector('.fps');
    let frames = 0;
    let at = performance.now();
    setInterval(() => {
      const now = performance.now();
      const count = medallion.debug()?.frames ?? 0;
      fps.textContent = `${Math.round(((count - frames) * 1000) / (now - at))} fps`;
      frames = count;
      at = now;
    }, 1000);
  </script>
</body>
</html>
